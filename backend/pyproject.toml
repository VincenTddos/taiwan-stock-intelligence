[project]
name = "twquant-backend"
version = "0.1.0"
description = "AI Taiwan Stock Intelligence Platform — Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "email-validator>=2.2.0",
    "greenlet>=3.1.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "structlog>=24.4.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "TID",           # tidy imports
    "RUF",
    "S",             # bandit (security)
]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI Depends() in defaults is the documented pattern
    "RUF001", # Chinese text legitimately contains full-width punctuation
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# ARCHITECTURE RULE (see flake8-tidy-imports below): only the api layer and the
# tests may import from app.api. Everything else would be a boundary violation.
"app/api/**" = ["TID251"]
"app/main.py" = ["TID251"]
"tests/**" = ["S105", "S106", "S311", "TID251"]
"alembic/**" = ["E501", "T201"]
"app/core/config.py" = ["S105"]  # names of settings fields, not literal secrets
"app/core/security.py" = ["S105"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ARCHITECTURE RULE: enforce module boundaries.
# api -> services -> repositories -> db.  The reverse direction is forbidden, so
# a service or repository that reaches back into app.api fails the lint gate.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"app.api".msg = "Lower layers must not import from app.api (module boundary violation)."

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*", "argon2.*", "asgi_lifespan.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL / Redis",
    "worker: requires a live Celery worker",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/alembic/*"]

[[tool.mypy.overrides]]
# Celery's decorators are untyped upstream; requiring typed decorators here
# would mean stubbing Celery rather than improving our own type safety.
module = "app.workers.*"
disallow_untyped_decorators = false
