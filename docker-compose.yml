# twquant — single-machine development / self-hosted stack.
#
# Profiles let a low-spec machine run only what it needs:
#   docker compose up                          → core (db, redis, api, worker, beat, web)
#   docker compose --profile llm up            → + ollama
#   docker compose --profile observability up  → + flower
#   docker compose --profile storage up        → + minio
#
# The database image is timescaledb-ha, which ships TimescaleDB *and* pgvector
# in one container. That is why the platform needs only one datastore.

name: twquant

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-twquant}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env}
  POSTGRES_DB: ${POSTGRES_DB:-twquant}

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  DEBUG: ${DEBUG:-false}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — see README}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  ENABLE_LLM: ${ENABLE_LLM:-false}
  OLLAMA_BASE_URL: http://ollama:11434
  ALLOW_MOCK_DATA: ${ALLOW_MOCK_DATA:-true}
  CORS_ORIGINS: '["http://localhost:3000"]'

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: twquant-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-twquant}
    volumes:
      - postgres-data:/home/postgres/pgdata/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      # Bound to loopback: the database must not be reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twquant} -d ${POSTGRES_DB:-twquant}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: twquant-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: ../docker/api.Dockerfile
    container_name: twquant-migrate
    environment:
      <<: [*postgres-env, *redis-env, *app-env]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: ../docker/api.Dockerfile
    container_name: twquant-api
    environment:
      <<: [*postgres-env, *redis-env, *app-env]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # `== 200`, not `< 500`. The looser form treated a 404 as healthy, so a
      # typo in this very path — or the route moving — would have produced a
      # container that reported itself fine while serving nothing.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          r = urllib.request.urlopen("http://localhost:8000/api/v1/health/redis")
          sys.exit(0 if r.status == 200 else 1)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/api.Dockerfile
    container_name: twquant-worker
    environment:
      <<: [*postgres-env, *redis-env, *app-env]
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - -Q
      - q_ingest,q_compute,q_nlp,q_user,q_maint
      - -l
      - info
      - --concurrency=${WORKER_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # CMD-SHELL, not CMD. `CMD` is the exec form: Docker runs the argv
      # directly with no shell, so `$HOSTNAME` is never expanded and celery is
      # asked to ping a node literally named `celery@$HOSTNAME`. That check can
      # never pass, the worker never becomes healthy, and `compose up --wait`
      # fails ~2 minutes in — which is exactly what it did the first time this
      # job ran. The `$$` is compose's own escape, so compose emits `$HOSTNAME`
      # and the shell is what expands it.
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: ../docker/api.Dockerfile
    container_name: twquant-beat
    environment:
      <<: [*postgres-env, *redis-env, *app-env]
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
    container_name: twquant-web
    environment:
      BACKEND_URL: http://api:8000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # ------------------------------------------------------------- optional
  ollama:
    image: ollama/ollama:latest
    container_name: twquant-ollama
    profiles: ["llm"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: ../docker/api.Dockerfile
    container_name: twquant-flower
    profiles: ["observability"]
    environment:
      <<: [*postgres-env, *redis-env, *app-env]
    command: ["celery", "-A", "app.workers.celery_app", "flower", "--port=5555"]
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: twquant-minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-twquant}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required when the storage profile is enabled}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  minio-data:
