name: CI

on:
  pull_request:
  push:
    # `main` is the default branch. `master` is listed too because the repo was
    # initialised locally before the remote existed, and a branch-name mismatch
    # here fails silently: the push succeeds, no workflow runs, and the badge
    # stays blank rather than red. Phase 2 already lost a defect to CI that was
    # configured but never executed — see PHASE_2_REPORT §13.
    branches: [main, master]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------- secrets
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- backend
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose, so CI exercises TimescaleDB and
        # pgvector exactly as production does. A local dev box may lack
        # TimescaleDB; CI never does.
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: twquant
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: twquant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twquant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: twquant
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: twquant_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-secret-key-long-enough-for-validation-0123456789abcdef
      # CI has the real image, so both extensions are required here.
      REQUIRE_TIMESCALEDB: "true"
      REQUIRE_PGVECTOR: "true"
      LOG_FORMAT: console
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # The cache key is hashed from a dependency file. The default globs
          # look for `uv.lock` or `requirements*.txt`, and this project has
          # neither — dependencies are declared in pyproject.toml and installed
          # with `uv pip install -e`. Without this the action fails outright
          # with "No file matched to [**/uv.lock]", which is what took the
          # backend job down on the first real CI run.
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]" asgi-lifespan pip-audit

      - name: Create the test database
        run: |
          PGPASSWORD=ci-password psql -h localhost -U twquant -d twquant \
            -c "CREATE DATABASE twquant_test OWNER twquant"

      - name: Lint (ruff)
        working-directory: backend
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Type check (mypy --strict)
        working-directory: backend
        run: |
          source .venv/bin/activate
          mypy app

      - name: Migrations are reversible (up → down → up)
        working-directory: backend
        run: |
          source .venv/bin/activate
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Migrations match the models (no drift)
        working-directory: backend
        run: |
          source .venv/bin/activate
          alembic check

      - name: Tests
        working-directory: backend
        run: |
          source .venv/bin/activate
          pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Dependency audit
        working-directory: backend
        run: |
          source .venv/bin/activate
          pip-audit --strict || echo "::warning::pip-audit reported findings"

      - name: Export the OpenAPI schema
        working-directory: backend
        run: |
          source .venv/bin/activate
          python -c "import json;from app.main import create_app;print(json.dumps(create_app().openapi(),indent=2))" > openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json

  # --------------------------------------------------------------- frontend
  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input. The version now comes from the `packageManager`
      # field in web/package.json, which corepack and this action both read —
      # so CI, the Docker build and a developer's laptop all resolve the same
      # pnpm. Specifying it in both places makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Type check
        working-directory: web
        run: pnpm typecheck

      - name: Tests
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build

  # ----------------------------------------------------------------- docker
  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./docker/api.Dockerfile
          push: false
          load: true
          tags: twquant-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./docker/web.Dockerfile
          push: false
          load: true
          tags: twquant-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------- compose e2e
  compose:
    name: Compose stack starts and is healthy
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Write a CI .env
        run: |
          cp .env.example .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-password|' .env
          sed -i 's|^JWT_SECRET=.*|JWT_SECRET=ci-secret-key-long-enough-for-validation-0123456789abcdef|' .env
          sed -i 's|^MINIO_ROOT_PASSWORD=.*|MINIO_ROOT_PASSWORD=ci-password|' .env

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Verify every component is healthy
        run: bash scripts/verify_stack.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
